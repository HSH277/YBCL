<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的订单 - 电商平台</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .stats-bar {
      display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap;
      background: var(--card-bg); padding: 16px; border-radius: var(--radius);
      box-shadow: var(--shadow); font-size: 14px;
    }
    .stat-item { color: var(--text-secondary); }
    .stat-item strong { margin-left: 4px; }
    .status-filter {
      display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap;
    }
    .pagination-bar {
      display: flex; justify-content: center; align-items: center;
      gap: 16px; margin-top: 24px; padding: 16px;
    }
    .page-info { font-size: 14px; color: var(--text-secondary); }
  </style>
</head>
<body>

<!-- 导航栏 -->
<nav class="navbar">
  <a href="index.html" class="logo">电商平台</a>
  <div class="nav-links">
    <a href="index.html">首页</a>
    <a href="cart.html" id="cartLink" style="display:none;">购物车</a>
    <a href="orders.html" id="ordersLink" style="display:none;">我的订单</a>
    <span class="user-info" id="userDisplay"></span>
    <button class="btn-logout" id="btnLogout" style="display:none;" onclick="logout()">退出</button>
    <a href="login.html" id="loginLink">登录</a>
  </div>
</nav>

<!-- 主内容 -->
<div class="container">
  <h2 style="margin-bottom:16px;">我的订单</h2>

  <!-- 订单统计 -->
  <div class="stats-bar" id="orderStats">加载中...</div>

  <!-- 状态筛选 -->
  <div class="status-filter">
    <button class="btn btn-primary btn-sm" onclick="filterByStatus('')">全部</button>
    <button class="btn btn-outline btn-sm" onclick="filterByStatus('pending')">待付款</button>
    <button class="btn btn-outline btn-sm" onclick="filterByStatus('paid')">已付款</button>
    <button class="btn btn-outline btn-sm" onclick="filterByStatus('shipped')">已发货</button>
    <button class="btn btn-outline btn-sm" onclick="filterByStatus('completed')">已完成</button>
    <button class="btn btn-outline btn-sm" onclick="filterByStatus('cancelled')">已取消</button>
  </div>

  <!-- 订单列表 -->
  <div class="order-list" id="orderList">
    <div style="text-align:center;padding:40px;color:#999;">加载中...</div>
  </div>

  <!-- 分页 -->
  <div id="pagination"></div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/orders.js"></script>
</body>
</html>
