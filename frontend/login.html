<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 电商平台</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-container" id="registerForm">
  <h2>用户注册</h2>
  <div class="error-msg" id="regError"></div>
  <div class="success-msg" id="regSuccess"></div>
  <div class="form-group">
    <label>用户名</label>
    <input type="text" id="regUsername" placeholder="请输入用户名 (3-20字符)">
  </div>
  <div class="form-group">
    <label>邮箱</label>
    <input type="email" id="regEmail" placeholder="请输入邮箱">
  </div>
  <div class="form-group">
    <label>密码</label>
    <input type="password" id="regPassword" placeholder="请输入密码 (至少6位)">
  </div>
  <button class="btn btn-primary" onclick="handleRegister()">注册</button>
  <div class="auth-switch">
    已有账号？<a onclick="showLogin()">去登录</a>
  </div>
</div>

<div class="auth-container" id="loginForm" style="display:none;">
  <h2>用户登录</h2>
  <div class="error-msg" id="loginError"></div>
  <div class="form-group">
    <label>用户名</label>
    <input type="text" id="loginUsername" placeholder="请输入用户名">
  </div>
  <div class="form-group">
    <label>密码</label>
    <input type="password" id="loginPassword" placeholder="请输入密码">
  </div>
  <button class="btn btn-primary" onclick="handleLogin()">登录</button>
  <div class="auth-switch">
    没有账号？<a onclick="showRegister()">去注册</a>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  // 检查是否已登录且 token 有效
  (async function checkLogin() {
    const token = localStorage.getItem('token');
    if (!token) return;

    // 验证 token 是否有效
    const res = await api.verifyToken();
    if (res.code === 200) {
      window.location.href = 'index.html';
    } else {
      // token 无效，清除
      localStorage.removeItem('token');
      localStorage.removeItem('user');
    }
  })();

  function showLogin() {
    document.getElementById('registerForm').style.display = 'none';
    document.getElementById('loginForm').style.display = '';
    clearMsgs();
  }

  function showRegister() {
    document.getElementById('loginForm').style.display = 'none';
    document.getElementById('registerForm').style.display = '';
    clearMsgs();
  }

  function clearMsgs() {
    document.getElementById('regError').style.display = 'none';
    document.getElementById('regSuccess').style.display = 'none';
    document.getElementById('loginError').style.display = 'none';
  }

  async function handleRegister() {
    const username = document.getElementById('regUsername').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPassword').value;

    const errEl = document.getElementById('regError');
    const okEl = document.getElementById('regSuccess');
    errEl.style.display = 'none';
    okEl.style.display = 'none';

    if (!username || !email || !password) {
      errEl.textContent = '所有字段不能为空';
      errEl.style.display = '';
      return;
    }
    if (username.length < 3 || username.length > 20) {
      errEl.textContent = '用户名长度应为3-20个字符';
      errEl.style.display = '';
      return;
    }
    if (password.length < 6) {
      errEl.textContent = '密码至少6位';
      errEl.style.display = '';
      return;
    }

    const res = await api.register({ username, email, password });
    if (res.code === 200) {
      okEl.textContent = '注册成功！请登录';
      okEl.style.display = '';
      setTimeout(showLogin, 1200);
    } else {
      errEl.textContent = res.message;
      errEl.style.display = '';
    }
  }

  async function handleLogin() {
    const username = document.getElementById('loginUsername').value.trim();
    const password = document.getElementById('loginPassword').value;

    const errEl = document.getElementById('loginError');
    errEl.style.display = 'none';

    if (!username || !password) {
      errEl.textContent = '用户名和密码不能为空';
      errEl.style.display = '';
      return;
    }

    const res = await api.login({ username, password });
    if (res.code === 200) {
      localStorage.setItem('token', res.data.token);
      localStorage.setItem('user', JSON.stringify(res.data.user));
      window.location.href = 'index.html';
    } else {
      errEl.textContent = res.message;
      errEl.style.display = '';
    }
  }

  // 回车键提交
  document.getElementById('loginPassword').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') handleLogin();
  });
  document.getElementById('regPassword').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') handleRegister();
  });
</script>
</body>
</html>
