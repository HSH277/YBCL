<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品列表 - 电商平台</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* 分页控件样式 */
    .pagination-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 24px;
      padding: 16px;
    }
    .pagination-bar .btn {
      min-width: 36px;
      height: 36px;
      padding: 0 12px;
      font-size: 13px;
    }
    .page-info {
      font-size: 13px;
      color: var(--text-secondary);
      margin-left: 12px;
    }
    /* Mock 模式提示 */
    .mock-banner {
      background: #fef3c7;
      color: #92400e;
      padding: 8px 16px;
      font-size: 13px;
      text-align: center;
    }
    .mock-banner a { color: #92400e; }
  </style>
</head>
<body>

<!-- Mock 模式提示 (JS 动态控制显示) -->
<div class="mock-banner" id="mockBanner" style="display:none;">
  当前为 Mock 数据模式（后端未启动），数据为模拟数据。
</div>

<!-- 导航栏 -->
<nav class="navbar">
  <a href="index.html" class="logo">电商平台</a>
  <div class="nav-links">
    <a href="index.html">首页</a>
    <a href="cart.html" id="cartLink" style="display:none;">购物车</a>
    <a href="orders.html" id="ordersLink" style="display:none;">我的订单</a>
    <span class="user-info" id="userDisplay"></span>
    <button class="btn-logout" id="btnLogout" style="display:none;" onclick="logout()">退出</button>
    <a href="login.html" id="loginLink">登录</a>
  </div>
</nav>

<!-- 主内容 -->
<div class="container">
  <!-- 搜索栏 -->
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="搜索商品名称...">
    <select id="categoryFilter">
      <option value="">全部分类</option>
    </select>
  </div>

  <!-- 商品网格 -->
  <div class="product-grid" id="productGrid">
    <div style="text-align:center;padding:40px;color:#999;">加载中...</div>
  </div>

  <!-- 分页控件 -->
  <div id="pagination"></div>
</div>

<!-- 引入顺序: request.js → mock.js → api.js → auth.js → products.js -->
<script src="js/request.js"></script>
<script src="js/mock.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/products.js"></script>

<script>
  // 后端不可用时显示 Mock 提示
  setTimeout(function() {
    if (Request.config.useMock) {
      document.getElementById('mockBanner').style.display = '';
    }
  }, 3000);
</script>
</body>
</html>
