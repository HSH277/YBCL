<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品详情 - 电商平台</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 导航栏 -->
<nav class="navbar">
  <a href="index.html" class="logo">电商平台</a>
  <div class="nav-links">
    <a href="index.html">首页</a>
    <a href="cart.html" id="cartLink" style="display:none;">购物车</a>
    <a href="orders.html" id="ordersLink" style="display:none;">我的订单</a>
    <span class="user-info" id="userDisplay"></span>
    <button class="btn-logout" id="btnLogout" style="display:none;" onclick="logout()">退出</button>
    <a href="login.html" id="loginLink">登录</a>
  </div>
</nav>

<!-- 主内容 -->
<div class="container" id="detailContainer">
  <div style="text-align:center;padding:40px;color:#999;">加载中...</div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
  async function loadProduct() {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    if (!id) {
      window.location.href = 'index.html';
      return;
    }

    const res = await api.getProduct(id);
    if (res.code !== 200) {
      document.getElementById('detailContainer').innerHTML =
        `<div style="text-align:center;padding:80px;color:#999;">${res.message}</div>`;
      return;
    }

    const p = res.data;
    document.getElementById('detailContainer').innerHTML = `
      <div class="product-detail">
        <div class="detail-img cat-${p.category || ''}">${p.name.charAt(0)}</div>
        <div class="detail-info">
          <h2>${p.name}</h2>
          <div class="price">¥${Number(p.price).toFixed(2)}</div>
          <p class="desc">${p.description || '暂无描述'}</p>
          <div class="stock-info">
            库存: <strong>${p.stock}</strong>
            ${p.lowStock ? '<span class="badge badge-danger" style="margin-left:8px;">库存紧张，欲购从速</span>' : ''}
          </div>
          <button class="btn btn-primary btn-add-cart" id="btnAddCart" onclick="addToCart(${p.id})"
            ${p.stock === 0 ? 'disabled' : ''}>
            ${p.stock === 0 ? '已售罄' : '加入购物车'}
          </button>
        </div>
      </div>
      <div style="margin-top:16px;">
        <a href="index.html" style="color:var(--primary);">← 返回商品列表</a>
      </div>`;
  }

  async function addToCart(productId) {
    if (!isLoggedIn()) {
      alert('请先登录');
      window.location.href = 'login.html';
      return;
    }

    const btn = document.getElementById('btnAddCart');
    btn.disabled = true;
    btn.textContent = '添加中...';

    const res = await api.addToCart({ product_id: productId, quantity: 1 });
    if (res.code === 200) {
      alert('已添加到购物车！');
    } else {
      alert(res.message);
    }
    btn.disabled = false;
    btn.textContent = '加入购物车';
  }

  document.addEventListener('DOMContentLoaded', loadProduct);
</script>
</body>
</html>
